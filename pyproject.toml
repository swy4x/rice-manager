[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-manager"
version = "0.4.0"
description = "Safety-first multi-profile dotfile manager for Hyprland and Quickshell"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rice Manager contributors" }]
dependencies = []

[project.scripts]
rice-manager = "rice_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
